<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Chat</title>
<style>
body{
    font-family:"Times New Roman",serif;
    background:white;
    color:black;
    margin:40px;
}
h2{
    font-weight:normal;
}
textarea{
    width:100%;
    height:150px;
    font-family:inherit;
    font-size:18px;
    padding:10px;
    box-sizing:border-box;
}
button{
    margin-top:10px;
    padding:8px 20px;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
}
button:disabled{
    cursor:wait;
    opacity:0.6;
}
#answer{
    margin-top:30px;
    border-top:1px solid black;
    padding-top:20px;
    white-space:pre-wrap;
}
</style>
</head>
<body>
<h2>Simple Chat</h2>
<textarea
id="prompt"
placeholder="Type your question here..."
></textarea>
<br>
<button id="send-button" type="button" onclick="send()">Send</button>
<div id="answer" role="status" aria-live="polite"></div>
<script>
async function send(){
    const answer=document.getElementById("answer");
    const button=document.getElementById("send-button");
    const prompt=document.getElementById("prompt").value.trim();
    if(!prompt){
        answer.textContent="Please enter a question.";
        return;
    }
    answer.textContent="Thinking...";
    button.disabled=true;
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),60000);
    try{
        const response=await fetch("/api/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({prompt}),
            signal:controller.signal
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok){
            throw new Error(data.error||"The request failed. Please try again.");
        }
        if(!data.answer){
            throw new Error("The assistant returned an empty answer. Please try again.");
        }
        answer.textContent=data.answer;
    }
    catch(error){
        answer.textContent=error.name==="AbortError"
            ? "The assistant took too long to respond. Please try again."
            : error.message;
    }
    finally{
        clearTimeout(timeout);
        button.disabled=false;
    }
}
document.getElementById("prompt").addEventListener("keydown",function(e){
    if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        send();
    }
});
</script>
</body>
</html>
