<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat</title>

  <style>
    body {
      font-family: "Times New Roman", serif;
      background: white;
      color: black;
      margin: 40px;
    }

    h2 {
      font-weight: normal;
    }

    textarea {
      width: 100%;
      height: 150px;
      font-family: inherit;
      font-size: 18px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 8px 20px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #answer {
      margin-top: 30px;
      border-top: 1px solid black;
      padding-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h2>Simple Chat</h2>

  <form id="chat-form" novalidate>
    <textarea
      id="prompt"
      placeholder="Type your question here..."
      aria-label="Your question"
      maxlength="20000"
    ></textarea>

    <br>

    <button id="send-button" type="submit">Send</button>
  </form>

  <div
    id="answer"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    hidden
  ></div>

  <script>
    (() => {
      const form = document.getElementById("chat-form");
      const promptInput = document.getElementById("prompt");
      const button = document.getElementById("send-button");
      const answer = document.getElementById("answer");

      let isSending = false;

      function showAnswer(message) {
        answer.hidden = false;
        answer.textContent = message;
      }

      async function send() {
        // Prevent duplicate requests from repeated Enter presses or clicks.
        if (isSending) return;

        const prompt = promptInput.value.trim();

        if (!prompt) {
          showAnswer("Please enter a question.");
          promptInput.focus();
          return;
        }

        if (prompt.length > 20000) {
          showAnswer("Your question is too long.");
          return;
        }

        isSending = true;
        button.disabled = true;
        answer.setAttribute("aria-busy", "true");
        showAnswer("Thinking...");

        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 60000);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ prompt }),
            signal: controller.signal
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            const message =
              data &&
              typeof data === "object" &&
              typeof data.error === "string"
                ? data.error
                : "The request failed. Please try again.";

            throw new Error(message);
          }

          if (
            !data ||
            typeof data !== "object" ||
            typeof data.answer !== "string" ||
            !data.answer.trim()
          ) {
            throw new Error(
              "The assistant returned an empty answer. Please try again."
            );
          }

          showAnswer(data.answer);
        } catch (error) {
          const timedOut =
            error &&
            typeof error === "object" &&
            error.name === "AbortError";

          showAnswer(
            timedOut
              ? "The assistant took too long to respond. Please try again."
              : error instanceof Error
                ? error.message
                : "The chat service is temporarily unavailable. Please try again."
          );
        } finally {
          window.clearTimeout(timeout);
          answer.setAttribute("aria-busy", "false");
          button.disabled = false;
          isSending = false;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        send();
      });

      promptInput.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing
        ) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
    })();
  </script>
</body>
</html>
